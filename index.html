<style>
:root{
  --vert:#0E3B24; --vert-fonce:#082218; --vert-clair:#17563A;
  --or:#C9A35C; --or-pale:#DFCB9C; --or-fond:#F3E8CC;
  --fond:#F4F4F0; --blanc:#FFFFFF; --bord:#E2E0D8;
  --texte:#1B1F1C; --gris:#6B7280; --gris-clair:#9CA3AF;
  --rouge:#96190F; --rouge-fond:#F8D5D0;
  --ambre:#7E5500; --ambre-fond:#F7E8BF;
  --ok:#145435; --ok-fond:#D2E8DC;
  /* palette par famille de modules : chaque couleur a une version sombre
     pour le texte sur blanc, une version claire pour le menu sur vert */
  --f-or:#7A5A12;     --f-or-bg:#F0E3C2;     --f-or-clair:#E0B86A;
  --f-vert:#145435;   --f-vert-bg:#CFE7DA;   --f-vert-clair:#6FC79A;
  --f-bleu:#17555F;   --f-bleu-bg:#CCE4E9;   --f-bleu-clair:#6CC2CE;
  --f-terre:#8E3D1F;  --f-terre-bg:#F4D7C6;  --f-terre-clair:#EE9468;
  --f-gris:#44505A;   --f-gris-bg:#DBE2E8;   --f-gris-clair:#A9BCC9;
  --r:10px; --ombre:0 1px 2px rgba(16,24,20,.06),0 4px 14px rgba(16,24,20,.05);
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--fond);color:var(--texte);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--vert-clair)}

/* ===== CONNEXION ===== */
#connexion{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(160deg,#17563A 0%,#0E3B24 45%,#082218 100%)}
.cx-carte{width:100%;max-width:560px;background:var(--blanc);border-radius:16px;padding:32px 28px 28px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.cx-logo{display:block;width:124px;margin:0 auto 14px}
.cx-carte h1{font-family:var(--serif);font-size:21px;text-align:center;color:var(--vert);letter-spacing:.3px}
.cx-sous{text-align:center;color:var(--gris);font-size:12.5px;margin-top:4px;letter-spacing:.6px;text-transform:uppercase}
.cx-trait{height:1px;background:var(--bord);margin:20px 0 16px;position:relative}
.cx-trait span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--blanc);padding:0 12px;font-size:11.5px;color:var(--gris-clair);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.cx-centres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cx-centre{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--bord);
  border-radius:var(--r);padding:11px 12px;background:var(--blanc);transition:.15s;position:relative}
.cx-centre:hover{border-color:var(--or);background:var(--or-fond)}
.cx-centre.on{border-color:var(--vert);background:var(--ok-fond);box-shadow:0 0 0 3px rgba(28,107,67,.1)}
.cx-centre .pin{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--f-bleu-bg);color:var(--f-bleu);font-size:15px}
.cx-centre.on .pin{background:var(--vert);color:#fff}
.cx-centre b{display:block;font-size:13.5px;font-weight:650}
.cx-centre small{color:var(--gris);font-size:11.5px}
.cx-centre .coche{position:absolute;top:8px;right:9px;font-size:12px;color:var(--ok);display:none}
.cx-centre.on .coche{display:block}
.cx-un{display:flex;align-items:center;gap:11px;border:1px solid var(--bord);border-radius:var(--r);
  padding:11px 12px;background:var(--or-fond)}
.cx-un .pin{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--vert);color:#fff;font-size:15px}
.cx-un b{display:block;font-size:13.5px;font-weight:650}
.cx-un small{color:var(--gris);font-size:11.5px}
.cx-choix{width:100%;padding:11px 12px;border:1px solid var(--bord);border-radius:var(--r);background:var(--blanc);font-size:13.5px}
.cx-choix:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px rgba(201,163,92,.15)}
.cx-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cx-role{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--bord);border-radius:var(--r);padding:11px 12px;background:var(--blanc);transition:.15s}
.cx-role:hover{border-color:var(--or);background:var(--or-fond)}
.cx-pastille{width:34px;height:34px;border-radius:50%;background:var(--vert);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
.cx-role b{display:block;font-size:13.5px;font-weight:650}
.cx-role small{color:var(--gris);font-size:11.5px}
.cx-note{margin-top:18px;font-size:12px;color:var(--gris);background:var(--or-fond);border:1px solid var(--or-pale);border-radius:var(--r);padding:10px 12px}

/* ===== STRUCTURE ===== */
#app{display:none;min-height:100%}
#app.actif{display:grid;grid-template-columns:232px minmax(0,1fr)}
.barre{background:linear-gradient(175deg,#10452B 0%,#0A2E1C 46%,#051810 100%);
  color:#D9E4DC;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.06)}
.barre-haut{padding:16px 14px 14px;border-bottom:1px solid rgba(255,255,255,.1);text-align:center}
.barre-haut img{width:74px;filter:brightness(0) invert(1);opacity:.95}
.barre-haut b{display:block;font-family:var(--serif);font-size:12.5px;letter-spacing:1.4px;color:#fff;margin-top:8px}
.barre-haut small{display:block;font-size:10px;letter-spacing:.8px;color:var(--or);text-transform:uppercase;margin-top:2px}
#centre-actif{margin-top:7px}
.ct-sel{width:100%;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(201,163,92,.45);
  border-radius:7px;padding:5px 8px;font-size:12px;letter-spacing:.3px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--or) 50%),linear-gradient(135deg,var(--or) 50%,transparent 50%);
  background-position:calc(100% - 13px) 11px,calc(100% - 9px) 11px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.ct-sel:focus{outline:0;border-color:var(--or)}
.ct-sel option{color:#1B1F1C}
.ct-fixe{font-size:10px;letter-spacing:.8px;color:var(--or);text-transform:uppercase}
nav{padding:10px 10px;flex:1;overflow-y:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:9px;color:#C7D5CC;font-size:13.5px;text-align:left;margin-bottom:2px;transition:.14s}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button:hover .ic{transform:scale(1.06)}
nav button.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 var(--k,var(--or))}
nav button .ic{width:25px;height:25px;flex:0 0 auto;display:grid;place-items:center;border-radius:7px;
  font-size:13px;line-height:1;color:var(--k,var(--or));background:var(--kbg,rgba(201,163,92,.18));
  box-shadow:inset 0 0 0 1px var(--kbd,rgba(201,163,92,.3));transition:.14s}
/* familles : une couleur par groupe, reprise dans le menu et sur les cartes */
.g-or   {--k:#E8C274;--kbg:rgba(232,194,116,.26);--kbd:rgba(232,194,116,.45)}
.g-vert {--k:#7BD3A6;--kbg:rgba(123,211,166,.26);--kbd:rgba(123,211,166,.45)}
.g-bleu {--k:#78CEDA;--kbg:rgba(120,206,218,.26);--kbd:rgba(120,206,218,.45)}
.g-terre{--k:#F3A074;--kbg:rgba(243,160,116,.26);--kbd:rgba(243,160,116,.45)}
.g-gris {--k:#B6C7D3;--kbg:rgba(182,199,211,.26);--kbd:rgba(182,199,211,.45)}
nav button.on .ic{background:var(--k,var(--or));color:#07221A;box-shadow:none}
nav .sep{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  color:rgba(255,255,255,.42);padding:15px 11px 6px}
nav .sep::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
nav .sep i{width:5px;height:5px;border-radius:50%;background:var(--k,var(--or));font-style:normal;flex:0 0 auto}
.barre-bas{padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.barre-bas b{color:#fff;display:block;font-size:13px}
.barre-bas span{color:var(--or)}
.barre-bas button{color:#9FB3A7;font-size:12px;margin-top:7px;text-decoration:underline}

main{min-width:0;padding:22px 26px 56px}
.tete{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.tete h2{font-family:var(--serif);font-size:23px;color:var(--vert);font-weight:400}
.tete p{color:var(--gris);font-size:13px;margin-top:2px}

.btn{background:var(--vert);color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;transition:.15s}
.btn:hover{background:var(--vert-clair)}
.btn.sec{background:var(--blanc);color:var(--vert);border:1px solid var(--bord)}
.btn.sec:hover{border-color:var(--or);background:var(--or-fond)}
.btn.or{background:var(--or);color:#2A1D05}
.btn.min{padding:5px 11px;font-size:12.5px;font-weight:500}

.carte{background:var(--blanc);border:1px solid var(--bord);border-radius:var(--r);box-shadow:var(--ombre)}
.carte-t{padding:13px 16px;border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between;gap:12px}
.carte-t h3{font-size:14px;font-weight:650;color:var(--vert)}
.carte-c{padding:16px}

.grille{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:1.6fr 1fr}

/* Indicateurs : fond franchement teinté, pastille d'icône pleine et chiffre
   dans la couleur de la famille — lisible même sur un écran délavé. */
.kpi{position:relative;display:flex;align-items:flex-start;gap:12px;
  background:var(--kbg2,var(--or-fond));border:1px solid var(--kbd2,var(--or-pale));
  border-left:5px solid var(--kc,var(--or));border-radius:var(--r);
  padding:14px 15px;box-shadow:var(--ombre)}
.kpi .pic{width:38px;height:38px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;
  background:var(--kc,var(--or));color:#fff;font-size:17px;line-height:1;
  box-shadow:0 2px 6px rgba(16,24,20,.18)}
.kpi .txt{min-width:0}
.kpi .lab{font-size:11px;color:var(--kc,var(--gris));text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.kpi .val{font-family:var(--serif);font-size:22px;color:var(--kc,var(--vert));margin-top:3px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:1500px){.kpi .val{font-size:25px}}
.kpi .sub{font-size:12px;color:#4A5450;margin-top:3px}
.kpi.alerte{--kc:var(--rouge); --kbg2:var(--rouge-fond); --kbd2:#E8B5AD}
.kpi.k-or   {--kc:var(--f-or);   --kbg2:var(--f-or-bg);   --kbd2:#DCC893}
.kpi.k-vert {--kc:var(--f-vert); --kbg2:var(--f-vert-bg); --kbd2:#A8CFBB}
.kpi.k-bleu {--kc:var(--f-bleu); --kbg2:var(--f-bleu-bg); --kbd2:#A2CBD3}
.kpi.k-terre{--kc:var(--f-terre);--kbg2:var(--f-terre-bg);--kbd2:#E2B093}
.kpi.k-gris {--kc:var(--f-gris); --kbg2:var(--f-gris-bg); --kbd2:#B6C4CF}

/* en-tête de carte : bandeau teinté à la couleur de la famille */
.carte-t{background:var(--hbg,transparent);border-radius:var(--r) var(--r) 0 0}
.carte-t h3{color:var(--hc,var(--vert))}
.carte-t h3::before{content:"";display:inline-block;width:4px;height:14px;border-radius:2px;
  background:var(--hc,var(--or));margin-right:8px;vertical-align:-2px}
.carte.h-or   {--hc:var(--f-or);   --hbg:var(--f-or-bg)}
.carte.h-vert {--hc:var(--f-vert); --hbg:var(--f-vert-bg)}
.carte.h-bleu {--hc:var(--f-bleu); --hbg:var(--f-bleu-bg)}
.carte.h-terre{--hc:var(--f-terre);--hbg:var(--f-terre-bg)}
.carte.h-gris {--hc:var(--f-gris); --hbg:var(--f-gris-bg)}

/* lignes d'alerte : fond teinté selon la gravité */
.alerte-l{border-radius:8px;padding:9px 11px;margin-bottom:6px;border-bottom:0}
.alerte-l.a-r{background:var(--rouge-fond)}
.alerte-l.a-a{background:var(--ambre-fond)}
.alerte-l.a-v{background:var(--ok-fond)}

/* comparaison recettes / dépenses du tableau de bord */
.barres{display:flex;flex-direction:column;gap:14px}
.barre-l .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.barre-l .t b{font-variant-numeric:tabular-nums}
.barre-l .p{height:12px;background:#DCDACF;border-radius:6px;overflow:hidden}
.barre-l .p span{display:block;height:100%;border-radius:6px;transition:width .4s}
.barre-l.b-vert .p span{background:linear-gradient(90deg,#2E8C5C,#1C6B43)}
.barre-l.b-vert .t b{color:var(--f-vert)}
.barre-l.b-terre .p span{background:linear-gradient(90deg,#D97A4A,#B3522E)}
.barre-l.b-terre .t b{color:var(--f-terre)}
.solde-l{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--bord);
  margin-top:4px;padding-top:12px;font-size:13.5px;font-weight:600}
.solde-l b{font-family:var(--serif);font-size:19px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--gris);font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--bord)}
td{padding:10px;border-bottom:1px solid #F0EFE9;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFAF7}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vide{text-align:center;color:var(--gris-clair);padding:30px 10px;font-size:13.5px}

.et{display:inline-block;font-size:11px;font-weight:600;padding:2.5px 8px;border-radius:20px;letter-spacing:.3px}
.et.v{background:var(--ok-fond);color:var(--ok)}
.et.r{background:var(--rouge-fond);color:var(--rouge)}
.et.a{background:var(--ambre-fond);color:var(--ambre)}
.et.g{background:#F1F1EC;color:var(--gris)}

.champ{margin-bottom:13px}
.champ label{display:block;font-size:12.5px;font-weight:600;color:#3A443D;margin-bottom:5px}
.champ input,.champ select,.champ textarea{width:100%;padding:9px 11px;border:1px solid var(--bord);border-radius:8px;background:var(--blanc);transition:.15s}
.champ input:focus,.champ select:focus,.champ textarea:focus{outline:0;border-color:var(--or);box-shadow:0 0 0 3px rgba(201,163,92,.15)}
.champ small{display:block;color:var(--gris-clair);font-size:11.5px;margin-top:4px}
.ligne{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{flex:1;min-width:110px;display:flex;align-items:center;gap:7px;border:1px solid var(--bord);border-radius:8px;padding:9px 11px;font-size:13px;cursor:pointer;background:var(--blanc)}
.radios label:has(input:checked){border-color:var(--or);background:var(--or-fond);font-weight:600}
.radios input{accent-color:var(--vert)}

.apercu{background:var(--or-fond);border:1px dashed var(--or);border-radius:var(--r);padding:12px 14px;font-size:13px}
.apercu b{color:var(--vert)}

.alerte-l{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #F0EFE9;font-size:13.5px}
.alerte-l:last-child{border-bottom:0}
.puce{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.puce.r{background:var(--rouge)}.puce.a{background:var(--ambre)}.puce.v{background:var(--ok)}
.alerte-l small{display:block;color:var(--gris);font-size:12px}

.recherche{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.recherche input,.recherche select{padding:8px 11px;border:1px solid var(--bord);border-radius:8px;background:var(--blanc)}
.recherche input{flex:1;min-width:190px}

.bandeau{background:var(--or-fond);border:1px solid var(--or-pale);border-left:3px solid var(--or);border-radius:var(--r);padding:12px 15px;font-size:13px;margin-bottom:18px;color:#4A3B1C}
.bandeau b{color:#2A1D05}

.phase{text-align:center;padding:48px 24px}
.phase .ph-ic{font-size:34px;opacity:.5}
.phase h3{font-family:var(--serif);font-size:19px;color:var(--vert);margin:12px 0 6px;font-weight:400}
.phase p{color:var(--gris);font-size:13.5px;max-width:460px;margin:0 auto}
.phase ul{max-width:460px;margin:14px auto 0;text-align:left;font-size:13px;color:#3A443D}
.phase li{margin-bottom:4px}

/* ===== MODALE ===== */
#modale{display:none;position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:60;padding:22px;overflow-y:auto}
#modale.on{display:block}
.mod{background:var(--blanc);border-radius:14px;max-width:720px;margin:24px auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mod.large{max-width:860px}
.recu-cadre{overflow:hidden}
.recu-echelle{transform-origin:top left;width:max-content}
.mod-t{padding:15px 20px;border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between}
.mod-t h3{font-family:var(--serif);font-size:18px;color:var(--vert);font-weight:400}
.mod-t button{font-size:22px;color:var(--gris);line-height:1;padding:0 4px}
.mod-c{padding:20px}
.mod-p{padding:14px 20px;border-top:1px solid var(--bord);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--vert);color:#fff;padding:11px 20px;border-radius:30px;font-size:13.5px;box-shadow:0 8px 26px rgba(0,0,0,.26);opacity:0;transition:.26s;z-index:90;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}

/* ===== REÇU ===== */
#zone-impression{display:none}
.recu{width:190mm;background:#fff;color:#000;padding:5mm 6mm 4mm;font-family:Arial,Helvetica,sans-serif;position:relative;border:1px solid #ddd}
.recu-fil{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:88mm;opacity:.07;pointer-events:none}
.recu-ent{display:flex;align-items:flex-start;gap:4mm;position:relative;z-index:2}
.recu-ent img{width:17mm;flex:0 0 auto}
.recu-ent .mid{flex:1;text-align:center}
.recu-ent h1{font-size:27px;font-weight:800;letter-spacing:.5px;line-height:1.05}
.recu-ent h2{font-size:12.5px;font-weight:700;letter-spacing:.2px;margin-top:1mm}
.recu-ent .tel{font-size:12.5px;font-weight:600;margin-top:.8mm}
.recu-corps{position:relative;z-index:2;margin-top:4mm}
.recu-r1{display:flex;align-items:flex-start;gap:4mm}
.recu-titre{font-size:19px;font-weight:700;flex:1;padding-top:2mm}
.recu-titre small{display:block;font-size:11px;font-weight:600;color:#333;margin-top:1mm}
.recu-modes{font-size:12.5px;font-weight:600;text-align:right;line-height:1.55}
.recu-modes .cs{display:inline-block;width:10px;height:10px;border:1.2px solid #000;margin-left:4px;position:relative;top:1px;text-align:center;line-height:9px;font-size:10px;font-weight:700}
.recu-mt{width:72mm;flex:0 0 auto}
.recu-mt .box{background:#C8C8C8;height:13mm;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;letter-spacing:.3px}
.recu-mt .lg{font-size:10.5px;font-style:italic;font-weight:700;text-align:right;margin-top:1mm}
.recu-de{font-size:13.5px;font-weight:600;margin-top:4mm;display:flex;align-items:baseline;gap:2mm}
.recu-de .pt{flex:1;border-bottom:1.6px dotted #000;padding:0 2mm 1px;font-weight:700}
.recu-som{display:flex;align-items:stretch;gap:2mm;margin-top:3mm}
.recu-som .lb{font-size:13.5px;font-weight:600;width:28mm;flex:0 0 auto}
.recu-som .lb i{display:block;font-size:11px}
.recu-som .bd{flex:1;background:#C8C8C8;min-height:11mm;display:flex;align-items:center;padding:1.5mm 3mm;font-size:12.5px;font-weight:700;text-transform:uppercase;line-height:1.35}
.recu-mot{font-size:13.5px;font-weight:600;margin-top:3.5mm;display:flex;align-items:baseline;gap:2mm}
.recu-mot .pt{flex:1;border-bottom:1.6px dotted #000;padding:0 2mm 1px;font-weight:700}
.recu-pied{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6mm;font-size:13.5px;font-weight:600}
.recu-pied .sig{text-align:center}
.recu-pied .sig b{font-weight:700}
.recu-pied .sig i{display:block;font-size:10.5px;font-weight:400;color:#444;font-style:normal;margin-top:9mm;border-top:1px dotted #777;padding-top:1mm;min-width:38mm}

/* ===== DOCUMENTS IMPRIMABLES (rapports, attestations) ===== */
.jauge{height:7px;background:#DCDACF;border-radius:4px;overflow:hidden}
.jauge span{display:block;height:100%;background:var(--or);border-radius:4px}
.doc{width:186mm;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:11.5px}
.doc-ent{display:flex;align-items:center;gap:5mm;border-bottom:1.5px solid #000;padding-bottom:3mm}
.doc-ent img{width:18mm}
.doc-ent h1{font-size:19px;font-weight:800;letter-spacing:.3px}
.doc-ent h2{font-size:10.5px;font-weight:700;margin-top:.6mm}
.doc-ent .tel{font-size:10px;font-weight:600;margin-top:.6mm}
.doc-titre{text-align:center;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin:6mm 0 5mm}
.doc-titre small{display:block;font-size:10.5px;font-weight:400;text-transform:none;letter-spacing:0;margin-top:1mm;color:#333}
.doc-h{font-size:12px;font-weight:700;margin:6mm 0 2mm;padding-bottom:1mm;border-bottom:1px solid #999}
.doc-t{width:100%;border-collapse:collapse;font-size:10.5px;margin-bottom:3mm}
.doc-t th{text-align:left;background:#EDEDED;border:1px solid #AAA;padding:1.6mm 2mm;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.doc-t td{border:1px solid #CCC;padding:1.5mm 2mm}
.doc-t .num{text-align:right;white-space:nowrap}
.doc-corps{font-size:12.5px;line-height:1.9}
.doc-corps p{margin-bottom:3mm}
.doc-nom{text-align:center;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:4mm 0}
.doc-sig{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm;margin-top:10mm;font-size:11.5px;font-weight:600}
.doc-sig .s{text-align:center}
.doc-sig .s i{display:block;font-style:normal;margin-top:14mm;border-top:1px dotted #777;min-width:42mm}

@media print{
  body{background:#fff}
  #app,#connexion,#modale,#toast{display:none!important}
  #zone-impression{display:block!important}
  .recu{border:0;width:auto;padding:0}
  .doc{width:auto}
  .doc-t{page-break-inside:auto}
  .doc-t tr{page-break-inside:avoid}
  .doc-t thead{display:table-header-group}
  .doc-sig{page-break-inside:avoid}
}

@media(max-width:1080px){.g4{grid-template-columns:1fr 1fr}.g21,.g3{grid-template-columns:1fr}}
@media(max-width:860px){
  #app.actif{grid-template-columns:minmax(0,1fr)}
  .barre{position:sticky;top:0;z-index:30;min-height:auto;flex-direction:row;flex-wrap:wrap;
    align-items:center;padding:8px 12px 2px;gap:8px;overflow:hidden}
  .barre-haut{border:0;padding:0;display:flex;align-items:center;gap:8px;text-align:left;flex:1 1 auto;min-width:0}
  .barre-haut img{width:30px;flex:0 0 auto}
  .barre-haut small{display:none}
  .barre-haut b{margin:0;font-size:11.5px;letter-spacing:.9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #centre-actif{margin:0 0 0 2px;flex:0 0 auto}
  .ct-sel{width:auto;padding:4px 24px 4px 7px;font-size:11px;background-position:calc(100% - 11px) 10px,calc(100% - 7px) 10px}
  .barre-bas{border:0;padding:0;flex:0 1 auto;min-width:0;text-align:right}
  .barre-bas b{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barre-bas span{display:none}
  .barre-bas button{margin-top:1px;font-size:11px}
  nav{order:3;flex:1 0 100%;width:100%;display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{width:auto;white-space:nowrap;margin:0;padding:6px 12px;font-size:12.5px;flex:0 0 auto}
  nav button.on{box-shadow:none}
  nav .sep{display:none}
  main{padding:16px 14px 46px;min-width:0}
  .g4,.g2,.ligne{grid-template-columns:1fr 1fr}
  .tete{align-items:flex-start}
  .cx-roles{grid-template-columns:1fr}
  .mod,.mod.large{max-width:100%}
  #modale{padding:10px}
}
@media(max-width:560px){.g4,.g2,.ligne{grid-template-columns:1fr}.tete h2{font-size:20px}
  .cx-trait span{font-size:10.5px;letter-spacing:.6px}}
</style>
</head>
<body>

<!-- ============ CONNEXION ============ -->

var COLLECTIONS = ["eleves","recus","depenses","memorisation","stock","personnel",
  "absences","paies","chambres","incidents","appels","menus","mouvements","donateurs","dons"];

/* Tout enregistrement sans centre explicite appartient à Pita. En production,
   ce champ est posé à l'écriture et contrôlé par les règles de sécurité. */
function normaliser(){
  COLLECTIONS.forEach(function(k){
    if(!D[k]) D[k] = [];
    D[k].forEach(function(x){ if(!x.c) x.c = "pita"; });
  });
  if(!D.journal) D.journal = [];
  if(!D.centres || !D.centres.length) D.centres = jeuDemo().centres;
  if(!D.centreActif) D.centreActif = D.centres[0].id;
}

function neuf(){
  var d = ajouterLabe(jeuDemo());
  delete d.elevesLabe;
  return d;
}

function charger(){
  try{
    var brut = localStorage.getItem(CLE);
    if(brut){ D = JSON.parse(brut); normaliser(); return; }
  }catch(e){ console.warn("Lecture impossible", e); }
  D = neuf();
  normaliser();
  sauver();
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(D)); }
  catch(e){ console.warn("Écriture impossible", e); }
}
function tracer(action, detail){
  D.journal.unshift({
    h:new Date().toISOString(),
    utilisateur: U ? ROLES[U].nom : "—",
    action:action, detail:detail
  });
  if(D.journal.length > 200) D.journal.length = 200;
  sauver();
}

  return p[2] + "/" + p[1] + "/" + p[0];
}
function dateLongue(iso){
  var d = iso ? new Date(iso) : new Date();
  return d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
}
function aujourdhui(){ return new Date().toISOString().slice(0,10); }

/* --- Montant en toutes lettres (français) --- */
var UNITES = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
  "onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
var DIZAINES = {2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante",8:"quatre-vingt"};

function deuxChiffres(n){
  if(n < 20) return UNITES[n];
  var d = Math.floor(n/10), u = n%10;
  if(d === 7 || d === 9){
    var base = (d === 7) ? "soixante" : "quatre-vingt";
    var r = n - (d === 7 ? 60 : 80);
    if(d === 7 && r === 11) return "soixante-et-onze";
    return base + "-" + UNITES[r];
  }
  var mot = DIZAINES[d];
  if(u === 0) return mot + (d === 8 ? "s" : "");
  if(u === 1 && d !== 8) return mot + "-et-un";
  return mot + "-" + UNITES[u];
}
/* suiviDeMille : « cent » et « vingt » restent invariables devant mille
   (deux cent mille, quatre-vingt mille) mais s'accordent devant million
   et milliard, qui sont des noms (deux cents millions). */
function troisChiffres(n, suiviDeMille){
  var c = Math.floor(n/100), r = n%100, s = "";
  if(c > 0){
    s = (c > 1 ? UNITES[c] + " " : "") + "cent";
    if(c > 1 && r === 0 && !suiviDeMille) s += "s";
  }
  if(r > 0){
    var fin = deuxChiffres(r);
    if(suiviDeMille && fin === "quatre-vingts") fin = "quatre-vingt";
    s += (s ? " " : "") + fin;
  }
  return s;
}
function enLettres(n){
  n = Math.round(Math.abs(Number(n) || 0));
  if(n === 0) return "zéro";
  var tranches = [
    {v:1000000000, s:"milliard"},
    {v:1000000,    s:"million"},
    {v:1000,       s:"mille"}
  ];
  var out = [];
  for(var i = 0; i < tranches.length; i++){
    var t = tranches[i], q = Math.floor(n / t.v);
    if(q > 0){
      n = n % t.v;
      if(t.s === "mille"){
        out.push((q === 1 ? "" : troisChiffres(q, true) + " ") + "mille");
      }else{
        out.push(troisChiffres(q, false) + " " + t.s + (q > 1 ? "s" : ""));
      }
    }
  }
  if(n > 0) out.push(troisChiffres(n, false));
  return out.join(" ").trim();
}
function montantLettres(n){
  n = Math.round(Math.abs(Number(n) || 0));
  var mots = enLettres(n);
  /* « cinq millions DE francs », mais « cinq millions cinq cent mille francs » */
  var liaison = /(millions?|milliards?)$/.test(mots) ? " de " : " ";
  var unite = (n === 1) ? "franc guinéen" : "francs guinéens";
  return (mots + liaison + unite).toUpperCase();
}

/* --- Centre actif : tout ce qui s'affiche passe par ces accès --- */

}
function centreDe(id){

}
function ac(a){

}

function RECS(){ return ac(D.recus); }
function DEPS(){ return ac(D.depenses); }
function MEMS(){ return ac(D.memorisation); }
function STK(){ return ac(D.stock); }
function PERS(){ return ac(D.personnel); }
function ABS(){ return ac(D.absences); }
function PAIES(){ return ac(D.paies); }
function CHB(){ return ac(D.chambres); }
function INC(){ return ac(D.incidents); }
function APP(){ return ac(D.appels); }
function MENUS(){ return ac(D.menus); }
function MVT(){ return ac(D.mouvements); }

/* Le centre se choisit avant le profil : on travaille dans un centre,
   puis on s'y identifie. */
function ecranCentres(){
  var zone = document.getElementById("cx-centres");
  var lab = document.getElementById("cx-lab-centre");
  var sous = document.getElementById("cx-sous");
  if(sous) sous.textContent = CT().nom;
  if(!zone) return;

  if(D.centres.length === 1){
    var seul = D.centres[0];
    if(lab) lab.textContent = "Centre";
    zone.innerHTML = '<div class="cx-un"><span class="pin">⌖</span>' +
      '<span><b>' + e(seul.nom) + '</b><small>Année scolaire ' + e(seul.annee) + '</small></span></div>';
    return;
  }

  if(lab) lab.textContent = "Choisissez le centre";
  zone.className = (D.centres.length > 3) ? "" : "cx-centres";

  if(D.centres.length > 3){
    zone.innerHTML = '<select class="cx-choix" onchange="choisirCentre(this.value)">' +
      D.centres.map(function(ct){
        return '<option value="' + ct.id + '"' + (ct.id === D.centreActif ? " selected" : "") + '>' +
          e(ct.nom) + '</option>';
      }).join("") + '</select>';
    return;
  }

  zone.innerHTML = D.centres.map(function(ct){
    var ne = D.eleves.filter(function(x){ return (x.c || "pita") === ct.id; }).length;
    var np = D.personnel.filter(function(x){ return (x.c || "pita") === ct.id; }).length;
    return '<button class="cx-centre' + (ct.id === D.centreActif ? " on" : "") + '" ' +
      'onclick="choisirCentre(\'' + ct.id + '\')">' +
      '<span class="coche">●</span>' +
      '<span class="pin">⌖</span>' +
      '<span><b>' + e(ct.ville) + '</b><small>' + ne + ' élève' + (ne>1?"s":"") + ' · ' + np + ' employé' + (np>1?"s":"") + '</small></span>' +
      '</button>';
  }).join("");
}

function choisirCentre(id){
  D.centreActif = id;
  sauver();
  ecranCentres();
}
function connecter(role){
  U = role;
  var r = ROLES[role];
  document.getElementById("u-nom").textContent = r.nom;
  document.getElementById("u-role").textContent = "Centre de " + CT().ville;
  document.getElementById("connexion").style.display = "none";

  construireMenu();

  aller(dispo.indexOf("tableau") >= 0 ? "tableau" : dispo[0]);

function deconnexion(){
  tracer("Déconnexion", ROLES[U] ? ROLES[U].nom : "—");
  U = null;
  document.getElementById("app").classList.remove("actif");
  document.getElementById("connexion").style.display = "flex";
}
function modulesAutorises(){
  var r = ROLES[U];

  if(r.modules === "*") return MODULES.map(function(m){ return m.id; });
  return r.modules;
}
function construireMenu(){
  var ok = modulesAutorises(), h = "", grpPrec = "";
  MODULES.forEach(function(m){
    if(ok.indexOf(m.id) < 0) return;
    var g = "g-" + (FAMILLES[m.grp] || "or");

/* ======================= CALCULS ======================= */
function totaux(){
  var rM = 0, dM = 0, rT = 0, dT = 0;
  RECS().forEach(function(r){ rT += r.montant; if(moisCourant(r.date)) rM += r.montant; });
  DEPS().forEach(function(d){ dT += d.montant; if(moisCourant(d.date)) dM += d.montant; });
  return {recettesMois:rM, depensesMois:dM, recettes:rT, depenses:dT, solde:rT - dT};
}
function paye(eleveId){
  var s = 0;
  D.recus.forEach(function(r){ if(r.eleve === eleveId) s += r.montant; });
  return s;
}
function impayes(){
  return ELS().filter(function(el){ return paye(el.id) < el.frais; });
}
function stockBas(){
  return STK().filter(function(s){ return s.qte < s.min; });
}

/* ======================= TABLEAU DE BORD ======================= */
function vueTableau(){
  var t = totaux();
  var eleves = ELS();
  var internes = eleves.filter(function(x){ return x.statut === "interne"; }).length;
  var imp = impayes(), bas = stockBas();

  var h = tete("Tableau de bord", CT().ville + " — année scolaire " + CT().annee + " — " + dateLongue());

  h += '<div class="bandeau"><b>Démonstration.</b> Les chiffres ci-dessous proviennent d\'un jeu de données fictif enregistré dans ce navigateur. Le bouton « Réinitialiser » dans Paramètres remet tout à zéro.</div>';

  h += '<div class="grille g4" style="margin-bottom:14px">' +
    kpi("Élèves inscrits", eleves.length, internes + " internes · " + (eleves.length - internes) + " semi-internes", false, "bleu", "☗") +
    kpi("Recettes du mois", fmG(t.recettesMois), RECS().filter(function(r){return moisCourant(r.date);}).length + " reçus émis", false, "vert", "₵") +
    kpi("Dépenses du mois", fmG(t.depensesMois), DEPS().filter(function(d){return moisCourant(d.date);}).length + " opérations", false, "terre", "▤") +
    kpi("Solde général", fmG(t.solde), "recettes moins dépenses", t.solde < 0, "or", "◆") +
    '</div>';

  h += '<div class="grille g21">';

  /* dernières opérations */
  var ops = [];
  RECS().forEach(function(r){ ops.push({d:r.date, t:"recette", l:"Reçu n° " + r.no + " — " + r.payeur, m:r.montant}); });
  DEPS().forEach(function(x){ ops.push({d:x.date, t:"depense", l:x.libelle, m:-x.montant}); });
  ops.sort(function(a,b){ return a.d < b.d ? 1 : -1; });
  ops = ops.slice(0,7);

  var lignes = ops.map(function(o){
    return '<tr><td>' + dateFr(o.d) + '</td><td>' + e(o.l) + '</td>' +
      '<td class="num" style="color:' + (o.m < 0 ? "var(--rouge)" : "var(--ok)") + '">' +
      (o.m < 0 ? "− " : "+ ") + fm(Math.abs(o.m)) + '</td></tr>';
  }).join("");

  h += '<div class="carte h-vert"><div class="carte-t"><h3>Dernières opérations</h3>' +
       '<button class="btn min sec" onclick="aller(\'caisse\')">Voir la caisse</button></div>' +
       '<div class="carte-c" style="padding:10px 6px">' +
       (lignes ? '<table><thead><tr><th>Date</th><th>Libellé</th><th class="num">Montant</th></tr></thead><tbody>' + lignes + '</tbody></table>'
               : '<div class="vide">Aucune opération.</div>') +
       '</div></div>';

  /* alertes */
  var al = "";
  bas.forEach(function(s){
    al += '<div class="alerte-l a-r"><span class="puce r"></span><div><b>' + e(s.article) + '</b>' +
          '<small>Stock minimum atteint — ' + s.qte + ' ' + e(s.unite) + ' en magasin, seuil ' + s.min + '</small></div></div>';
  });
  if(imp.length){
    var du = imp.reduce(function(a,x){ return a + (x.frais - paye(x.id)); }, 0);
    al += '<div class="alerte-l a-a"><span class="puce a"></span><div><b>' + imp.length + ' élève' + (imp.length>1?"s":"") + ' en situation d\'impayé</b>' +
          '<small>' + e(fmG(du)) + ' restent à recouvrer sur l\'année en cours</small></div></div>';
  }
  var moisEnCours = new Date().toISOString().slice(0,7);
  var nonPayes = PERS().filter(function(p){
    if(p.statut !== "actif") return false;
    var ys = PAIES();
    for(var i = 0; i < ys.length; i++) if(ys[i].personnel === p.id && ys[i].mois === moisEnCours) return false;
    return true;
  });
  if(nonPayes.length){
    al += '<div class="alerte-l a-a"><span class="puce a"></span><div><b>' + nonPayes.length + ' salaire' + (nonPayes.length>1?"s":"") + ' non versé' + (nonPayes.length>1?"s":"") + '</b>' +
          '<small>Pour le mois de ' + e(moisFr(moisEnCours)) + '</small></div></div>';
  }
  var sansChambre = ELS().filter(function(x){ return x.statut === "interne" && !x.chambre; });
  if(sansChambre.length){
    al += '<div class="alerte-l a-a"><span class="puce a"></span><div><b>' + sansChambre.length + ' pensionnaire' + (sansChambre.length>1?"s":"") + ' sans chambre</b>' +
          '<small>À affecter depuis le module Internat</small></div></div>';
  }
  var incRecents = INC().filter(function(i){
    return (Date.now() - Date.parse(i.date)) < 7 * 86400000;
  });
  if(incRecents.length){
    al += '<div class="alerte-l a-r"><span class="puce r"></span><div><b>' + incRecents.length + ' incident' + (incRecents.length>1?"s":"") + ' à l\'internat cette semaine</b>' +
          '<small>' + e(incRecents.map(function(i){ return i.type; }).join(", ")) + '</small></div></div>';
  }

  h += '<div class="carte h-or"><div class="carte-t"><h3>Alertes</h3></div><div class="carte-c" style="padding:6px 16px">' + al + '</div></div>';
  h += '</div>';

  /* équilibre du mois + répartition des dépenses, lisibles d'un coup d'œil */
  var maxi = Math.max(t.recettesMois, t.depensesMois, 1);
  var pr = Math.round(t.recettesMois / maxi * 100);
  var pd = Math.round(t.depensesMois / maxi * 100);
  var soldeMois = t.recettesMois - t.depensesMois;

  h += '<div class="grille g2" style="margin-top:14px">';

    '<span style="font-size:12px;color:var(--gris)">' + e(moisFr(new Date().toISOString().slice(0,7))) + '</span></div>' +
    '<div class="carte-c"><div class="barres">' +
      '<div class="barre-l b-vert"><div class="t"><span>Recettes encaissées</span><b>' + e(fmG(t.recettesMois)) + '</b></div>' +
        '<div class="p"><span style="width:' + pr + '%"></span></div></div>' +
      '<div class="barre-l b-terre"><div class="t"><span>Dépenses engagées</span><b>' + e(fmG(t.depensesMois)) + '</b></div>' +
        '<div class="p"><span style="width:' + pd + '%"></span></div></div>' +
      '<div class="solde-l"><span>' + (soldeMois >= 0 ? "Excédent du mois" : "Déficit du mois") + '</span>' +
        '<b style="color:' + (soldeMois >= 0 ? "var(--f-vert)" : "var(--rouge)") + '">' + e(fmG(Math.abs(soldeMois))) + '</b></div>' +
    '</div>' +
    '<div class="apercu" style="margin-top:14px">' +
      (t.depensesMois
        ? 'Les recettes du mois couvrent <b>' + Math.round(t.recettesMois / t.depensesMois * 100) + ' %</b> des dépenses engagées.'
        : 'Aucune dépense engagée ce mois-ci.') +
    '</div></div></div>';

  var depMois = DEPS().filter(function(x){ return moisCourant(x.date); });
  var pc = {};
  depMois.forEach(function(x){ pc[x.categorie] = (pc[x.categorie] || 0) + x.montant; });
  var cls = Object.keys(pc).sort(function(a,b){ return pc[b] - pc[a]; }).slice(0,5);
  var teintes = ["var(--f-terre)","var(--f-or)","var(--f-bleu)","var(--f-vert)","var(--f-gris)"];
  var lp = cls.map(function(k, i){
    var pct = t.depensesMois ? Math.round(pc[k] / t.depensesMois * 100) : 0;
    return '<tr><td style="width:14px"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:' + teintes[i] + '"></span></td>' +
      '<td>' + e(k) + '</td><td class="num">' + fm(pc[k]) + '</td>' +
      '<td style="width:34%"><div class="jauge"><span style="width:' + pct + '%;background:' + teintes[i] + '"></span></div></td>' +
      '<td class="num" style="width:40px">' + pct + ' %</td></tr>';
  }).join("");

  h += '<div class="carte h-terre"><div class="carte-t"><h3>Où part l\'argent ce mois</h3>' +
    '<button class="btn min sec" onclick="aller(\'rapports\')">Rapports</button></div>' +
    '<div class="carte-c" style="padding:10px 6px">' +
    (lp ? '<table><tbody>' + lp + '</tbody></table>' : '<div class="vide">Aucune dépense ce mois-ci.</div>') +
    '</div></div>';
  h += '</div>';
  return h;
}
/* couleur : "or" | "vert" | "bleu" | "terre" | "gris" — l'alerte l'emporte.
   icone : un caractère affiché dans la pastille, facultatif. */
function kpi(lab, val, sub, alerte, couleur, icone){
  var cl = alerte ? " alerte" : (couleur ? " k-" + couleur : "");
  var pic = (alerte && !icone) ? "!" : icone;
  return '<div class="kpi' + cl + '">' +
         (pic ? '<span class="pic">' + e(pic) + '</span>' : "") +
         '<span class="txt"><span class="lab">' + e(lab) + '</span>' +
         '<div class="val">' + e(val) + '</div><div class="sub">' + e(sub) + '</div></span></div>';
}

function majPayeur(){
  var el = eleveParId(document.getElementById("f-eleve").value);
  var p = document.getElementById("f-payeur");
  if(el && !p.value) p.value = el.tuteur;
  var m = document.getElementById("f-montant");
  if(el && !m.value){ m.value = el.frais; majLettres(); }
}
function majLettres(){
  var v = Number(document.getElementById("f-montant").value) || 0;
  document.getElementById("f-lettres").innerHTML = v > 0
    ? '<b>En lettres :</b> ' + e(montantLettres(v))
    : "Le montant en toutes lettres s'affichera ici.";
}
function enregistrerRecu(){
  var payeur = document.getElementById("f-payeur").value.trim();
  var motif = document.getElementById("f-motif").value.trim();
  var montant = Number(document.getElementById("f-montant").value) || 0;
  var date = document.getElementById("f-date").value || aujourdhui();
  var eleve = document.getElementById("f-eleve").value;
  var mode = "Espèces";
  var rs = document.getElementsByName("f-mode");
  for(var i = 0; i < rs.length; i++) if(rs[i].checked) mode = rs[i].value;

  if(!payeur){ toast("Le nom du payeur est obligatoire."); return; }
  if(montant <= 0){ toast("Indiquez un montant supérieur à zéro."); return; }
  if(!motif){ toast("Le motif est obligatoire."); return; }

  D.sequence += 1;
  var pre = (D.centreActif === "pita") ? String(new Date().getFullYear())
                                       : (D.centreActif.charAt(0).toUpperCase() + String(new Date().getFullYear()).slice(2));
  var no = pre + "-" + String(D.sequence).padStart(4,"0");
  var r = {no:no, c:D.centreActif, date:date, eleve:eleve, payeur:payeur, motif:motif,
           montant:montant, mode:mode, caissier: ROLES[U].nom};
  D.recus.push(r);
  tracer("Création d'un reçu", "N° " + no + " — " + fmG(montant) + " — " + payeur);
  sauver();
  fermerModale();
  toast("Reçu n° " + no + " enregistré.");
  aller("caisse");
  voirRecu(no);
}

function orientation(mode){
  var st = document.getElementById("page-css");
  if(st) st.textContent = (mode === "portrait")
    ? "@page{size:A4 portrait;margin:14mm 12mm}"
    : "@page{size:A4 landscape;margin:8mm}";
}

function voirRecu(no){
  var r = null;
  for(var i = 0; i < D.recus.length; i++) if(D.recus[i].no === no) r = D.recus[i];
  if(!r){ toast("Reçu introuvable."); return; }
  var html = htmlRecu(r);
  orientation("paysage");
  document.getElementById("zone-impression").className = "";
  document.getElementById("zone-impression").innerHTML = html;
  ouvrirModale("Reçu n° " + r.no,
    '<div class="recu-cadre"><div class="recu-echelle">' + html + '</div></div>',
    '<button class="btn sec" onclick="fermerModale()">Fermer</button>' +
    '<button class="btn or" onclick="window.print()">Imprimer</button>');
  document.querySelector(".mod").classList.add("large");
  ajusterRecu();
}

/* Le reçu est dessiné en millimètres pour l'impression ; à l'écran il est
   réduit pour tenir dans la fenêtre sans rogner les bords. */
function ajusterRecu(){
  var cadre = document.querySelector(".recu-cadre");
  var ech = document.querySelector(".recu-echelle");
  if(!cadre || !ech) return;
  var recu = ech.querySelector(".recu");
  if(!recu) return;
  ech.style.transform = "none";
  var dispo = cadre.clientWidth;
  var large = recu.offsetWidth;
  var k = large > 0 ? Math.min(1, dispo / large) : 1;
  ech.style.transform = "scale(" + k + ")";
  cadre.style.height = (recu.offsetHeight * k) + "px";
}
window.addEventListener("resize", function(){
  if(document.getElementById("modale").classList.contains("on")) ajusterRecu();
});

      '</div>' +
      '<div class="recu-de"><span>De Mr/Mlle/Mme :</span><span class="pt">' + e(r.payeur) + '</span></div>' +
      '<div class="recu-som">' +

  var parCat = {};
  deps.forEach(function(d){ parCat[d.categorie] = (parCat[d.categorie] || 0) + d.montant; });
  var cats = Object.keys(parCat).sort(function(a,b){ return parCat[b] - parCat[a]; });

  h += '<div class="grille g3" style="margin-bottom:14px">' +
    kpi("Total des dépenses", fmG(t.depenses), deps.length + " opérations", false, "terre", "▤") +

    return '<tr><td>' + dateFr(d.date) + '</td><td><span class="et g">' + e(d.categorie) + '</span></td>' +
      '<td>' + e(d.libelle) + '</td><td>' + e(d.fournisseur) + '</td>' +
      '<td><span class="et g">' + e(d.mode) + '</span></td>' +
      '<td class="num"><b>' + fm(d.montant) + '</b></td></tr>';
  }).join("");

  h += '<div class="carte h-terre"><div class="carte-t"><h3>Journal des dépenses</h3></div><div class="carte-c" style="padding:10px 6px;overflow-x:auto">' +
    (lignes ? '<table><thead><tr><th>Date</th><th>Catégorie</th><th>Libellé</th><th>Fournisseur</th><th>Mode</th><th class="num">Montant</th></tr></thead><tbody>' + lignes + '</tbody></table>'

function enregistrerDepense(){
  var lib = document.getElementById("d-lib").value.trim();
  var mt = Number(document.getElementById("d-mt").value) || 0;
  if(!lib){ toast("Le libellé est obligatoire."); return; }
  if(mt <= 0){ toast("Indiquez un montant supérieur à zéro."); return; }
  D.depenses.push({
    id:"D" + Date.now(), c:D.centreActif,
    date:document.getElementById("d-date").value || aujourdhui(),
    categorie:document.getElementById("d-cat").value,
    libelle:lib,
    fournisseur:document.getElementById("d-four").value.trim() || "—",
    montant:mt,
    mode:document.getElementById("d-mode").value
  });
  tracer("Enregistrement d'une dépense", lib + " — " + fmG(mt));
  sauver(); fermerModale(); toast("Dépense enregistrée."); aller("depenses");
}

function vueEleves(){
  var h = tete("Élèves", ELS().length + " élèves inscrits — " + CT().ville + ", année " + CT().annee,
    '<button class="btn" onclick="formEleve()">+ Inscrire un élève</button>');

    '<input id="rch" placeholder="Rechercher un nom, un tuteur, une classe…" oninput="filtrerEleves()">' +
    '<select id="fst" onchange="filtrerEleves()"><option value="">Tous les statuts</option><option>interne</option><option>semi-interne</option></select>' +
    '<select id="fcl" onchange="filtrerEleves()"><option value="">Toutes les classes</option>' +
      uniq(ELS().map(function(x){ return x.classe; })).map(function(c){ return '<option>' + e(c) + '</option>'; }).join("") +
    '</select></div>';

  h += '<div class="carte"><div class="carte-c" style="padding:10px 6px;overflow-x:auto">' +
    '<table><thead><tr><th>Élève</th><th>Classe</th><th>Statut</th><th>Tuteur</th>' +
    '<th class="num">Frais convenus</th><th class="num">Payé</th><th>Situation</th><th></th></tr></thead>' +
    '<tbody id="tb-eleves"></tbody></table></div></div>';

  setTimeout(filtrerEleves, 0);
  return h;
}
function uniq(a){ var o = []; a.forEach(function(x){ if(o.indexOf(x) < 0) o.push(x); }); return o.sort(); }

function filtrerEleves(){
  var q = (document.getElementById("rch").value || "").toLowerCase();
  var st = document.getElementById("fst").value;
  var cl = document.getElementById("fcl").value;
  var liste = ELS().filter(function(el){
    var txt = (el.prenom + " " + el.nom + " " + el.tuteur + " " + el.classe).toLowerCase();
    return (!q || txt.indexOf(q) >= 0) && (!st || el.statut === st) && (!cl || el.classe === cl);
  });
  var h = liste.map(function(el){
    var p = paye(el.id), reste = el.frais - p;
    var et = reste <= 0 ? '<span class="et v">Soldé</span>'
           : (p > 0 ? '<span class="et a">Reste ' + fm(reste) + '</span>'
                    : '<span class="et r">Non payé</span>');
    return '<tr><td><b>' + e(el.prenom + " " + el.nom) + '</b><br><small style="color:var(--gris)">' + e(el.id) + '</small></td>' +
      '<td>' + e(el.classe) + '</td>' +
      '<td><span class="et ' + (el.statut === "interne" ? "v" : "g") + '">' + e(el.statut) + '</span></td>' +
      '<td>' + e(el.tuteur) + '<br><small style="color:var(--gris)">' + e(el.tel) + '</small></td>' +
      '<td class="num">' + fm(el.frais) + '</td><td class="num">' + fm(p) + '</td><td>' + et + '</td>' +
      '<td class="num"><button class="btn min sec" onclick="ficheEleve(\'' + el.id + '\')">Fiche</button></td></tr>';
  }).join("");
  document.getElementById("tb-eleves").innerHTML = h || '<tr><td colspan="8" class="vide">Aucun élève ne correspond à cette recherche.</td></tr>';
}

function ficheEleve(id){
  var el = eleveParId(id);
  if(!el) return;
  var p = paye(id), reste = el.frais - p;
  var rs = D.recus.filter(function(r){ return r.eleve === id; });
  var ms = D.memorisation.filter(function(m){ return m.eleve === id; });

  var corps =
    '<div class="grille g2" style="margin-bottom:16px">' +
      '<div><div class="champ"><label>Classe</label><div>' + e(el.classe) + '</div></div>' +
          '<div class="champ"><label>Statut</label><div>' + e(el.statut) + '</div></div>' +
          '<div class="champ"><label>Inscrit le</label><div>' + dateFr(el.inscrit) + '</div></div></div>' +
      '<div><div class="champ"><label>Tuteur</label><div>' + e(el.tuteur) + '</div></div>' +
          '<div class="champ"><label>Téléphone</label><div>' + e(el.tel) + '</div></div>' +
          '<div class="champ"><label>Situation des frais</label><div><b>' + fm(p) + '</b> payé sur ' + fm(el.frais) +
            (reste > 0 ? ' — <span style="color:var(--rouge)">reste ' + fm(reste) + ' GNF</span>' : ' — <span style="color:var(--ok)">soldé</span>') +
          '</div></div></div>' +
    '</div>';

  corps += '<h4 style="font-size:13px;color:var(--vert);margin-bottom:8px">Versements (' + rs.length + ')</h4>';
  corps += rs.length
    ? '<table style="margin-bottom:16px"><tbody>' + rs.map(function(r){
        return '<tr><td>' + dateFr(r.date) + '</td><td>' + e(r.motif) + '</td><td>' + e(r.mode) + '</td>' +
               '<td class="num"><b>' + fm(r.montant) + '</b></td>' +
               '<td class="num"><button class="btn min sec" onclick="fermerModale();voirRecu(\'' + e(r.no) + '\')">Reçu</button></td></tr>';
      }).join("") + '</tbody></table>'
    : '<div class="vide" style="padding:16px">Aucun versement enregistré.</div>';

  corps += '<h4 style="font-size:13px;color:var(--vert);margin:4px 0 8px">Mémorisation (' + ms.length + ')</h4>';
  corps += ms.length
    ? '<table><tbody>' + ms.map(function(m){
        return '<tr><td>' + dateFr(m.date) + '</td><td><b>' + e(m.sourate) + '</b> — pages ' + e(m.pages) + '</td>' +
               '<td>' + e(m.tajwid) + '</td><td class="num">' + m.note + '/20</td></tr>';
      }).join("") + '</tbody></table>'
    : '<div class="vide" style="padding:16px">Aucune récitation enregistrée.</div>';

  ouvrirModale(el.prenom + " " + el.nom, corps,
    '<button class="btn sec" onclick="fermerModale()">Fermer</button>' +
    '<button class="btn sec" onclick="fermerModale();attestation(\'' + el.id + '\')">Attestation de scolarité</button>' +
    '<button class="btn" onclick="fermerModale();aller(\'caisse\');formRecu();">Encaisser un versement</button>');
}

function enregistrerEleve(){
  var prenom = document.getElementById("e-prenom").value.trim();
  var nom = document.getElementById("e-nom").value.trim();
  if(!prenom || !nom){ toast("Le nom et le prénom sont obligatoires."); return; }
  D.seqEleve = (D.seqEleve || D.eleves.length) + 1;
  var pref = (D.centreActif === "pita") ? "E" : (D.centreActif.charAt(0).toUpperCase());
  D.eleves.push({

function enregistrerMouvement(){
  var id = document.getElementById("s-art").value;
  var type = document.getElementById("s-type").value;
  var q = Number(document.getElementById("s-qte").value) || 0;
  if(q <= 0){ toast("Indiquez une quantité valide."); return; }
  var art = null;
  for(var i = 0; i < D.stock.length; i++) if(D.stock[i].id === id) art = D.stock[i];
  if(!art) return;
  if(type === "sortie" && q > art.qte){ toast("Quantité supérieure au stock disponible."); return; }
  art.qte += (type === "entree" ? q : -q);
  D.mouvements.push({
    id:"V" + Date.now(), c:D.centreActif, date:aujourdhui(), article:art.id,
    type:type, qte:q, par:ROLES[U].nom,
    destination:document.getElementById("s-dest").value
  });
  tracer("Mouvement de stock", (type === "entree" ? "Entrée" : "Sortie") + " de " + q + " " + art.unite + " — " + art.article);
  sauver(); fermerModale(); toast("Mouvement enregistré."); aller("stock");
}

            : '<div class="vide">Aucun employé enregistré.</div>') + '</div></div>';

function fichePersonnel(id){
  var p = parId(D.personnel, id);
  if(!p) return;
  var ys = PAIES().filter(function(y){ return y.personnel === id; }).sort(function(a,b){ return a.mois < b.mois ? 1 : -1; });
  var as = ABS().filter(function(a){ return a.personnel === id; }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  var total = ys.reduce(function(a,y){ return a + y.net; }, 0);

  var corps = '<div class="grille g2" style="margin-bottom:16px">' +
    '<div><div class="champ"><label>Poste</label><div>' + e(p.poste) + '</div></div>' +
        '<div class="champ"><label>Catégorie</label><div>' + e(p.type) + '</div></div>' +
        '<div class="champ"><label>Téléphone</label><div>' + e(p.tel) + '</div></div></div>' +
    '<div><div class="champ"><label>Embauché le</label><div>' + dateFr(p.embauche) + '</div></div>' +
        '<div class="champ"><label>Salaire mensuel</label><div><b>' + fmG(p.salaire) + '</b></div></div>' +
        '<div class="champ"><label>Total versé</label><div>' + fmG(total) + ' sur ' + ys.length + ' mois</div></div></div>' +
    '</div>';

  corps += '<h4 style="font-size:13px;color:var(--vert);margin-bottom:8px">Historique des rémunérations</h4>';
  corps += ys.length ? '<table style="margin-bottom:16px"><thead><tr><th>Mois</th><th class="num">Brut</th><th class="num">Avance</th><th class="num">Net versé</th><th>Mode</th></tr></thead><tbody>' +
      ys.map(function(y){
        return '<tr><td>' + e(moisFr(y.mois)) + '</td><td class="num">' + fm(y.brut) + '</td>' +
          '<td class="num">' + (y.avance ? "− " + fm(y.avance) : "—") + '</td>' +
          '<td class="num"><b>' + fm(y.net) + '</b></td><td>' + e(y.mode) + '</td></tr>';
      }).join("") + '</tbody></table>'
    : '<div class="vide" style="padding:16px">Aucun salaire versé.</div>';

  corps += '<h4 style="font-size:13px;color:var(--vert);margin:4px 0 8px">Absences et congés</h4>';
  corps += as.length ? '<table><tbody>' + as.map(function(a){
      return '<tr><td>' + dateFr(a.date) + '</td><td><b>' + e(a.type) + '</b></td><td>' + e(a.motif) + '</td>' +
             '<td>' + (a.justifiee ? "Justifiée" : "Non justifiée") + '</td></tr>';
    }).join("") + '</tbody></table>'
    : '<div class="vide" style="padding:16px">Aucune absence enregistrée.</div>';

  ouvrirModale(p.nom, corps,
    '<button class="btn sec" onclick="fermerModale()">Fermer</button>' +
    '<button class="btn" onclick="fermerModale();formPaie(\'' + p.id + '\')">Payer son salaire</button>');
}

function majPaie(garderBrut){

  var net = (Number(b.value) || 0) - (Number(document.getElementById("y-av").value) || 0);
  document.getElementById("y-net").innerHTML = '<b>Net à verser :</b> ' + e(fmG(Math.max(0, net)));

function enregistrerPaie(){
  var pid = document.getElementById("y-pers").value;
  var brut = Number(document.getElementById("y-brut").value) || 0;
  var av = Number(document.getElementById("y-av").value) || 0;
  if(!pid){ toast("Choisissez un employé."); return; }
  if(brut <= 0){ toast("Indiquez le salaire brut."); return; }
  if(av > brut){ toast("L'avance dépasse le salaire brut."); return; }
  var mois = document.getElementById("y-mois").value || new Date().toISOString().slice(0,7);
  var deja = PAIES().filter(function(y){ return y.personnel === pid && y.mois === mois; });

  D.paies.push({
    id:"Y" + Date.now(), c:D.centreActif, personnel:pid, mois:mois,

  });
  D.depenses.push({

function vueInternat(){

    kpi("Taux d'occupation", capacite ? Math.round(internes.length / capacite * 100) + " %" : "—", capacite - internes.length + " places libres", false, "terre", "◑") +
    kpi("Dernier appel", dernier ? dateFr(dernier.date) : "—", dernier ? dernier.presents + " présents · " + dernier.absents + " absents" : "aucun appel", dernier && dernier.absents > 0, "or", "☰") +

  h += '<div class="carte h-terre"><div class="carte-t"><h3>Chambres et affectations</h3>' +

    '<div class="carte-c" style="padding:10px 6px;overflow-x:auto">' +
    (lignes ? '<table><thead><tr><th>Chambre</th><th class="num">Occupation</th><th>Pensionnaires</th><th>État</th></tr></thead><tbody>' + lignes + '</tbody></table>'
            : '<div class="vide">Aucune chambre enregistrée.</div>') + '</div></div>';

  var nonAffectes = internes.filter(function(x){ return !x.chambre; });
  var ai = "";
  if(nonAffectes.length){
    ai += '<div class="alerte-l a-a"><span class="puce a"></span><div><b>' + nonAffectes.length + ' pensionnaire' + (nonAffectes.length>1?"s":"") + ' sans chambre</b>' +
      '<small>' + e(nonAffectes.map(function(x){ return x.prenom + " " + x.nom; }).join(", ")) + '</small></div></div>';
  }
  incidents.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).slice(0,5).forEach(function(i){
    var p = i.type === "Santé" ? "r" : (i.type === "Discipline" ? "a" : "v");
    ai += '<div class="alerte-l a-' + p + '"><span class="puce ' + p + '"></span><div><b>' + e(i.type) + ' — ' + e(nomEleve(i.eleve)) + '</b>' +
      '<small>' + dateFr(i.date) + " · " + e(i.description) + '</small>' +
      '<small style="color:var(--vert-clair)">Suite : ' + e(i.suite) + '</small></div></div>';
  });
  if(!ai) ai = '<div class="vide">Aucun incident signalé.</div>';

  h += '<div class="carte h-or"><div class="carte-t"><h3>Incidents et signalements</h3></div>' +
       '<div class="carte-c" style="padding:6px 16px">' + ai + '</div></div>';
  h += '</div>';

  var la = appels.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).slice(0,6).map(function(a){
    return '<tr><td>' + dateFr(a.date) + '</td><td class="num">' + a.presents + '</td>' +
      '<td class="num">' + (a.absents ? '<span class="et r">' + a.absents + '</span>' : '<span class="et v">0</span>') + '</td>' +
      '<td>' + e(a.note) + '</td></tr>';
  }).join("");

  h += '<div class="carte" style="margin-top:14px"><div class="carte-t"><h3>Appels du soir</h3></div>' +
    '<div class="carte-c" style="padding:10px 6px;overflow-x:auto">' +

        : '<div class="vide">Aucun appel enregistré.</div>') + '</div></div>';
  return h;
}

/* ======================= CUISINE ET RESTAURATION ======================= */

/* Valeur des denrées sorties du magasin vers la cuisine sur une période.
   C'est le seul chiffre qui relie le stock à la comptabilité : il évite
   la double saisie que le cahier des charges demande d'éliminer. */
function coutSorties(depuis, jusqu){
  var total = 0;
  MVT().forEach(function(v){
    if(v.type !== "sortie" || v.destination !== "Cuisine") return;
    if(depuis && v.date < depuis) return;
    if(jusqu && v.date > jusqu) return;
    var a = parId(D.stock, v.article);
    if(a) total += v.qte * a.prix;
  });
  return total;
}
function joursServis(){
  return uniq(MENUS().map(function(m){ return m.date; }));
}

function vueCuisine(){
  var menus = MENUS();
  var jours = joursServis();
  var repasServis = menus.length;
  var convives = menus.reduce(function(a,m){ return a + m.convives; }, 0);
  var cout = coutSorties();
  var coutRepas = repasServis ? cout / repasServis : 0;
  var coutConvive = convives ? cout / convives : 0;
  var coutJour = jours.length ? cout / jours.length : 0;

  var h = tete("Cuisine et restauration", "Menus, denrées consommées et coût réel des repas",
    '<button class="btn sec" onclick="formSortieCuisine()">Sortie de denrées</button> ' +
    '<button class="btn" onclick="formMenu()">+ Planifier un repas</button>');

  h += '<div class="bandeau"><b>Lecture du coût.</b> Les montants ci-dessous ne sont pas saisis : ils sont calculés à partir des denrées réellement sorties du magasin vers la cuisine, valorisées au prix d\'achat. Si les sorties ne sont pas saisies chaque jour, ces chiffres perdent leur sens.</div>';

  h += '<div class="grille g4" style="margin-bottom:14px">' +
    kpi("Repas servis", repasServis, jours.length + " jour" + (jours.length>1?"s":"") + " de service", false, "terre", "◍") +
    kpi("Denrées consommées", fmG(cout), "sorties valorisées au prix d'achat", false, "terre", "▥") +
    kpi("Coût moyen par repas", fmG(Math.round(coutRepas)), "toutes catégories confondues", false, "or", "₵") +
    kpi("Coût par convive", fmG(Math.round(coutConvive)), convives + " couverts servis", false, "or", "◆") +
    '</div>';

  h += '<div class="grille g21">';

  var lm = menus.slice().sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); }).map(function(m){
    return '<tr><td>' + dateFr(m.date) + '</td><td><span class="et g">' + e(m.repas) + '</span></td>' +
      '<td><b>' + e(m.plat) + '</b></td><td class="num">' + m.convives + '</td></tr>';
  }).join("");

  h += '<div class="carte h-terre"><div class="carte-t"><h3>Menus planifiés et servis</h3>' +
    '<span style="font-size:12px;color:var(--gris)">coût journalier moyen ' + e(fmG(Math.round(coutJour))) + '</span></div>' +
    '<div class="carte-c" style="padding:10px 6px;overflow-x:auto">' +
    (lm ? '<table><thead><tr><th>Date</th><th>Repas</th><th>Plat</th><th class="num">Convives</th></tr></thead><tbody>' + lm + '</tbody></table>'
        : '<div class="vide">Aucun menu planifié.</div>') + '</div></div>';

  var sorties = MVT().filter(function(v){ return v.type === "sortie" && v.destination === "Cuisine"; })
    .sort(function(a,b){ return a.date < b.date ? 1 : -1; }).slice(0,8);
  var ls = sorties.map(function(v){
    var a = parId(D.stock, v.article);
    return '<tr><td>' + dateFr(v.date) + '</td><td>' + e(nomArticle(v.article)) + '</td>' +
      '<td class="num">' + v.qte + " " + e(a ? a.unite : "") + '</td>' +
      '<td class="num">' + fm(a ? v.qte * a.prix : 0) + '</td></tr>';
  }).join("");

  h += '<div class="carte h-or"><div class="carte-t"><h3>Denrées sorties vers la cuisine</h3></div>' +
    '<div class="carte-c" style="padding:10px 6px;overflow-x:auto">' +
    (ls ? '<table><thead><tr><th>Date</th><th>Article</th><th class="num">Quantité</th><th class="num">Valeur</th></tr></thead><tbody>' + ls + '</tbody></table>'
        : '<div class="vide">Aucune sortie enregistrée.</div>') + '</div></div>';
  h += '</div>';

  /* besoins estimés à partir de l'effectif réellement nourri */
  var internes = ELS().filter(function(x){ return x.statut === "interne"; }).length;
  var semi = ELS().filter(function(x){ return x.statut === "semi-interne"; }).length;
  var employes = PERS().filter(function(p){ return p.statut === "actif"; }).length;
  var couvertsJour = internes * 3 + semi + employes;

  h += '<div class="carte" style="margin-top:14px"><div class="carte-t"><h3>Besoins journaliers estimés</h3></div>' +
    '<div class="carte-c"><table><tbody>' +
    '<tr><td>Internes, trois repas par jour</td><td class="num">' + internes + ' × 3</td><td class="num"><b>' + (internes*3) + '</b></td></tr>' +
    '<tr><td>Semi-internes, déjeuner seul</td><td class="num">' + semi + ' × 1</td><td class="num"><b>' + semi + '</b></td></tr>' +
    '<tr><td>Employés présents</td><td class="num">' + employes + ' × 1</td><td class="num"><b>' + employes + '</b></td></tr>' +
    '<tr><td><b>Couverts à prévoir chaque jour</b></td><td></td><td class="num"><b>' + couvertsJour + '</b></td></tr>' +
    '</tbody></table>' +
    '<div class="apercu" style="margin-top:12px">Sur la base du coût par convive observé, une journée complète revient à environ <b>' +
    e(fmG(Math.round(coutConvive * couvertsJour))) + '</b>.</div>' +
    '</div></div>';
  return h;
}

function vueDons(){
  var gs = DONAT(), xs = DONS();
  var recu = xs.reduce(function(a,x){ return a + x.montant; }, 0);
  var engage = gs.reduce(function(a,g){ return a + (g.engagement || 0); }, 0);
  var moisEnCours = new Date().toISOString().slice(0,7);
  var recuCeMois = xs.filter(function(x){ return String(x.date).slice(0,7) === moisEnCours; })
                     .reduce(function(a,x){ return a + x.montant; }, 0);
  var attendu = Math.max(0, engage - recuCeMois);

  var h = tete("Dons et parrainages", gs.length + " donateurs et parrains",
    '<button class="btn sec" onclick="formDonateur()">+ Donateur</button> ' +
    '<button class="btn" onclick="formDon()">+ Enregistrer un don</button>');

  h += '<div class="grille g4" style="margin-bottom:14px">' +
    kpi("Total reçu", fmG(recu), xs.length + " versements", false, "vert", "♥") +
    kpi("Engagements mensuels", fmG(engage), gs.filter(function(g){ return g.engagement > 0; }).length + " parrains réguliers", false, "vert", "◷") +
    kpi("Reçu ce mois", fmG(recuCeMois), moisFr(moisEnCours), false, "vert", "₵") +

function enregistrerDon(){

                                         : (D.centreActif.charAt(0).toUpperCase() + String(new Date().getFullYear()).slice(2));

/* Excel francophone : séparateur point-virgule et BOM, sinon les accents
   et les colonnes se mélangent à l'ouverture. */
function csv(lignes){
  return "﻿" + lignes.map(function(l){
    return l.map(function(cell){
      var v = (cell == null) ? "" : String(cell);
      return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(";");
  }).join("\r\n");
}
function telecharger(nom, contenu, type){
  try{
    var blob = new Blob([contenu], {type:(type || "text/csv") + ";charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nom;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast("Fichier « " + nom + " » téléchargé.");
  }catch(err){
    toast("Téléchargement impossible sur cet appareil.");
  }
}
function suffixe(){
  return CT().ville.toLowerCase().replace(/[^a-z]/g,"") + "-" + aujourdhui();
}
function exportCsvDons(){
  var l = [["Date","Donateur","Type","Affectation","Mode","Montant GNF","Reçu"]];
  DONS().slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).forEach(function(x){
    var g = parId(D.donateurs, x.donateur);
    l.push([dateFr(x.date), nomDonateur(x.donateur), g ? g.type : "", x.affectation, x.mode, x.montant, x.recu || ""]);
  });
  telecharger("dons-" + suffixe() + ".csv", csv(l));
}

/* ======================= RAPPORTS ======================= */
var PERIODE = {type:"mois", debut:"", fin:""};

function bornes(){
  var d = new Date(), deb, fin;
  if(PERIODE.type === "mois"){
    deb = new Date(d.getFullYear(), d.getMonth(), 1);
    fin = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  }else if(PERIODE.type === "precedent"){
    deb = new Date(d.getFullYear(), d.getMonth() - 1, 1);
    fin = new Date(d.getFullYear(), d.getMonth(), 0);
  }else if(PERIODE.type === "annee"){
    deb = new Date(d.getFullYear(), 0, 1);
    fin = new Date(d.getFullYear(), 11, 31);
  }else{
    return {debut:PERIODE.debut || "0000-01-01", fin:PERIODE.fin || "9999-12-31"};
  }
  var iso = function(x){
    return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
  };
  return {debut:iso(deb), fin:iso(fin)};
}
function dansPeriode(iso){
  var b = bornes();
  var d = String(iso).slice(0,10);
  return d >= b.debut && d <= b.fin;
}
function libellePeriode(){
  var b = bornes();
  return "du " + dateFr(b.debut) + " au " + dateFr(b.fin);
}
function changerPeriode(t){
  PERIODE.type = t;
  if(t === "perso"){
    var b = bornes();
    if(!PERIODE.debut) PERIODE.debut = b.debut;
    if(!PERIODE.fin) PERIODE.fin = b.fin;
  }
  aller("rapports");
}
function majDatesPerso(){
  PERIODE.debut = document.getElementById("rp-deb").value;
  PERIODE.fin = document.getElementById("rp-fin").value;
  aller("rapports");
}

function donneesRapport(){
  var rec = RECS().filter(function(r){ return dansPeriode(r.date); });
  var dep = DEPS().filter(function(d){ return dansPeriode(d.date); });
  var parCat = {};
  dep.forEach(function(d){ parCat[d.categorie] = (parCat[d.categorie] || 0) + d.montant; });
  var parMode = {};
  rec.forEach(function(r){ parMode[r.mode] = (parMode[r.mode] || 0) + r.montant; });
  var tr = rec.reduce(function(a,r){ return a + r.montant; }, 0);
  var td = dep.reduce(function(a,d){ return a + d.montant; }, 0);
  return {rec:rec, dep:dep, parCat:parCat, parMode:parMode, totalRec:tr, totalDep:td, solde:tr - td};
}

    l.push([r.no, dateFr(r.date), r.payeur, r.eleve ? nomEleve(r.eleve) : "", r.motif, r.mode, r.montant, r.caissier || ""]);
  });
  telecharger("recus-" + suffixe() + ".csv", csv(l));
}
function exportCsvDepenses(){
  var l = [["Date","Catégorie","Libellé","Fournisseur","Mode","Montant GNF"]];
  DEPS().slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).forEach(function(d){
    l.push([dateFr(d.date), d.categorie, d.libelle, d.fournisseur, d.mode, d.montant]);
  });
  telecharger("depenses-" + suffixe() + ".csv", csv(l));
}
function exportCsvPersonnel(){
  var l = [["Nom","Poste","Catégorie","Téléphone","Embauche","Salaire GNF","Total versé GNF","Absences"]];
  PERS().forEach(function(p){
    var tot = PAIES().filter(function(y){ return y.personnel === p.id; }).reduce(function(a,y){ return a + y.net; }, 0);
    var nb = ABS().filter(function(a){ return a.personnel === p.id; }).length;
    l.push([p.nom, p.poste, p.type, p.tel, dateFr(p.embauche), p.salaire, tot, nb]);
  });
  telecharger("personnel-" + suffixe() + ".csv", csv(l));
}
function exportCsvStock(){
  var l = [["Article","Catégorie","Quantité","Unité","Seuil","Prix unitaire GNF","Valeur GNF","État"]];
  STK().forEach(function(s){
    l.push([s.article, s.categorie, s.qte, s.unite, s.min, s.prix, s.qte * s.prix, s.qte < s.min ? "À réapprovisionner" : "Suffisant"]);
  });
  telecharger("stock-" + suffixe() + ".csv", csv(l));
}
function exportCsvImpayes(){
  var l = [["Élève","Classe","Tuteur","Téléphone","Frais GNF","Payé GNF","Reste dû GNF"]];
  impayes().forEach(function(x){
    var p = paye(x.id);
    l.push([x.prenom + " " + x.nom, x.classe, x.tuteur, x.tel, x.frais, p, x.frais - p]);
  });
  telecharger("impayes-" + suffixe() + ".csv", csv(l));
}

/* --- Rapport imprimable --- */
function enteteDoc(titre, sous){
  var c = CT();
  return '<div class="doc-ent"><img src="' + LOGO + '" alt="">' +
    '<div><h1>' + e(c.nom) + '</h1><h2>' + e(c.sousTitre) + '</h2>' +
    '<div class="tel">Tél : ' + e(c.tels) + '</div></div></div>' +
    '<div class="doc-titre">' + e(titre) + '<small>' + e(sous) + '</small></div>';
}
function imprimerRapport(){
  var R = donneesRapport();
  var cats = Object.keys(R.parCat).sort(function(a,b){ return R.parCat[b] - R.parCat[a]; });
  var h = '<div class="doc">' + enteteDoc("Rapport financier", libellePeriode());

  h += '<table class="doc-t"><thead><tr><th>Synthèse</th><th class="num">Montant (GNF)</th></tr></thead><tbody>' +
    '<tr><td>Total des recettes</td><td class="num">' + fm(R.totalRec) + '</td></tr>' +
    '<tr><td>Total des dépenses</td><td class="num">' + fm(R.totalDep) + '</td></tr>' +
    '<tr><td><b>Résultat de la période</b></td><td class="num"><b>' + fm(R.solde) + '</b></td></tr>' +
    '</tbody></table>';

  if(cats.length){
    h += '<h3 class="doc-h">Dépenses par poste</h3><table class="doc-t"><thead><tr><th>Poste</th>' +
      '<th class="num">Montant (GNF)</th><th class="num">Part</th></tr></thead><tbody>' +
      cats.map(function(c){
        var pct = R.totalDep ? Math.round(R.parCat[c] / R.totalDep * 100) : 0;
        return '<tr><td>' + e(c) + '</td><td class="num">' + fm(R.parCat[c]) + '</td><td class="num">' + pct + ' %</td></tr>';
      }).join("") + '</tbody></table>';
  }

  if(R.rec.length){
    h += '<h3 class="doc-h">Détail des recettes</h3><table class="doc-t"><thead><tr><th>N°</th><th>Date</th>' +
      '<th>Payeur</th><th>Motif</th><th class="num">Montant</th></tr></thead><tbody>' +
      R.rec.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).map(function(r){
        return '<tr><td>' + e(r.no) + '</td><td>' + dateFr(r.date) + '</td><td>' + e(r.payeur) + '</td>' +
          '<td>' + e(r.motif) + '</td><td class="num">' + fm(r.montant) + '</td></tr>';
      }).join("") + '</tbody></table>';
  }

  if(R.dep.length){
    h += '<h3 class="doc-h">Détail des dépenses</h3><table class="doc-t"><thead><tr><th>Date</th><th>Poste</th>' +
      '<th>Libellé</th><th>Fournisseur</th><th class="num">Montant</th></tr></thead><tbody>' +
      R.dep.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; }).map(function(d){
        return '<tr><td>' + dateFr(d.date) + '</td><td>' + e(d.categorie) + '</td><td>' + e(d.libelle) + '</td>' +
          '<td>' + e(d.fournisseur) + '</td><td class="num">' + fm(d.montant) + '</td></tr>';
      }).join("") + '</tbody></table>';
  }

  h += '<div class="doc-sig"><div>' + e(CT().ville) + ', le ' + dateLongue() + '</div>' +
    '<div class="s"><b>LE DIRECTEUR</b><i></i></div>' +
    '<div class="s"><b>LE RESPONSABLE FINANCIER</b><i></i></div></div>';
  h += '</div>';

  orientation("portrait");
  document.getElementById("zone-impression").className = "portrait";
  document.getElementById("zone-impression").innerHTML = h;
  tracer("Impression d'un rapport", libellePeriode());
  setTimeout(function(){ window.print(); }, 60);
}

function attestation(id){
  var el = eleveParId(id);
  if(!el) return;
  var h = '<div class="doc">' + enteteDoc("Attestation de scolarité", "Année scolaire " + CT().annee);
  h += '<div class="doc-corps">' +
    '<p>Je soussigné, Directeur du ' + e(CT().nom) + ', atteste que :</p>' +
    '<p class="doc-nom">' + e(el.prenom + " " + el.nom) + '</p>' +
    '<p>inscrit sous le matricule <b>' + e(el.id) + '</b>, est régulièrement inscrit dans notre établissement ' +
    'au titre de l\'année scolaire <b>' + e(CT().annee) + '</b>, en qualité d\'élève <b>' + e(el.statut) + '</b>, ' +
    'dans la classe de <b>' + e(el.classe) + '</b>.</p>' +
    '<p>Son tuteur déclaré est <b>' + e(el.tuteur) + '</b>, joignable au ' + e(el.tel) + '.</p>' +
    '<p>En foi de quoi la présente attestation lui est délivrée pour servir et valoir ce que de droit.</p>' +
    '</div>';
  h += '<div class="doc-sig"><div>' + e(CT().ville) + ', le ' + dateLongue() + '</div>' +
    '<div class="s"><b>LE DIRECTEUR</b><i></i></div></div>';
  h += '</div>';
  orientation("portrait");
  document.getElementById("zone-impression").className = "portrait";
  document.getElementById("zone-impression").innerHTML = h;
  tracer("Édition d'une attestation", el.prenom + " " + el.nom);
  setTimeout(function(){ window.print(); }, 60);
}

/* ======================= JOURNAL ======================= */
function vueJournal(){
  var h = tete("Journal des opérations", "Trace horodatée des actions sensibles");
  h += '<div class="bandeau">Dans la version complète, ce journal n\'est modifiable depuis aucun écran et conserve la valeur avant et après chaque modification.</div>';

  var lignes = D.journal.map(function(j){
    var d = new Date(j.h);
    return '<tr><td>' + dateFr(j.h) + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") +
      '</td><td>' + e(j.utilisateur) + '</td><td><b>' + e(j.action) + '</b></td><td>' + e(j.detail) + '</td></tr>';
  }).join("");

  h += '<div class="carte"><div class="carte-c" style="padding:10px 6px;overflow-x:auto">' +
    (lignes ? '<table><thead><tr><th>Horodatage</th><th>Utilisateur</th><th>Action</th><th>Détail</th></tr></thead><tbody>' + lignes + '</tbody></table>'
            : '<div class="vide">Aucune opération tracée pour l\'instant. Enregistrez un reçu ou une dépense.</div>') + '</div></div>';
  return h;
}

    '<div class="grille g2" style="margin-bottom:14px">' +

    ligneEcart("Stockage", "Navigateur de cet appareil", "Base centralisée, règles de sécurité par rôle et par centre") +
    ligneEcart("Hors ligne", "L'application s'ouvre sans réseau, mais les saisies ne se synchronisent pas", "File d'attente locale et synchronisation au retour du réseau") +
    ligneEcart("Photos", "Non gérées", "Photo d'élève et justificatifs de dépense redimensionnés puis stockés") +
    ligneEcart("Exports", "Excel et impression, déjà fonctionnels", "Identiques, plus l'envoi automatique du rapport mensuel") +
    ligneEcart("Multi-centre", "Deux centres, cloisonnés à l'affichage", "Même cloisonnement appliqué côté serveur par les règles de sécurité") +
    ligneEcart("Parents", "Non gérée", "Notification des échéances et des impayés par SMS ou WhatsApp") +

function ligneEcart(quoi, demo, prod){
  return '<tr><td style="width:22%"><b>' + e(quoi) + '</b></td>' +
         '<td style="width:36%;color:var(--gris)">' + e(demo) + '</td>' +
         '<td>' + e(prod) + '</td></tr>';
}
function enregistrerParams(){
  var c = CT();
  c.nom = document.getElementById("p-nom").value.trim() || c.nom;
  c.sousTitre = document.getElementById("p-sous").value.trim();
  c.tels = document.getElementById("p-tels").value.trim();
  c.ville = document.getElementById("p-ville").value.trim() || c.ville;
  c.annee = document.getElementById("p-annee").value.trim() || c.annee;
  tracer("Modification des paramètres", c.nom);
  majEnteteCentre();
  sauver(); toast("Paramètres enregistrés."); aller("parametres");
}
function exporterJson(){
  telecharger("rachid-gestion-" + aujourdhui() + ".json", JSON.stringify(D, null, 2), "application/json");
}

function formCentre(){
  var corps =
    '<div class="champ"><label>Nom du centre</label><input id="z-nom" placeholder="CENTRE RACHID DE DALABA"></div>' +
    '<div class="ligne">' +
      '<div class="champ"><label>Ville</label><input id="z-ville" placeholder="Dalaba"></div>' +
      '<div class="champ"><label>Année scolaire</label><input id="z-annee" value="' + e(CT().annee) + '"></div>' +
    '</div>' +
    '<div class="champ"><label>Téléphones</label><input id="z-tels" placeholder="(+224) 6XX XX XX XX"></div>' +
    '<div class="apercu">Le nouveau centre démarre vide. Les données des autres centres lui restent invisibles.</div>';
  ouvrirModale("Ajouter un centre", corps,
    '<button class="btn sec" onclick="fermerModale()">Annuler</button>' +
    '<button class="btn" onclick="enregistrerCentre()">Créer le centre</button>');
}
function enregistrerCentre(){
  var nom = document.getElementById("z-nom").value.trim();
  var ville = document.getElementById("z-ville").value.trim();
  if(!nom || !ville){ toast("Le nom et la ville sont obligatoires."); return; }
  var id = ville.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0,10) || ("c" + Date.now());
  for(var i = 0; i < D.centres.length; i++) if(D.centres[i].id === id){ toast("Un centre porte déjà ce nom de ville."); return; }
  D.centres.push({
    id:id, nom:nom, sousTitre:CT().sousTitre, ville:ville,
    tels:document.getElementById("z-tels").value.trim() || "—",
    annee:document.getElementById("z-annee").value.trim() || CT().annee
  });
  tracer("Création d'un centre", nom);
  sauver(); fermerModale(); toast("Centre créé."); majEnteteCentre(); aller("parametres");
}
function reinitialiser(){
  if(!confirm("Remettre la démonstration dans son état initial ? Toutes vos saisies seront effacées.")) return;
  D = neuf(); normaliser(); sauver(); majEnteteCentre(); construireMenu(); toast("Démonstration réinitialisée."); aller("tableau");
}

/* ======================= INSTALLATION SUR TÉLÉPHONE ======================= */
/* Le service worker met l'application en cache : elle s'ouvre ensuite même
   sans réseau. Penser à relever CACHE dans sw.js à chaque mise en ligne,
   sinon les téléphones gardent l'ancienne version. */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(err){
      console.warn("Service worker non enregistré", err);
    });
  });
}

var invite = null;
window.addEventListener("beforeinstallprompt", function(ev){
  ev.preventDefault();
  invite = ev;
  var b = document.getElementById("btn-install");
  if(b) b.style.display = "inline-block";
});
function installer(){
  if(!invite){
    toast("Sur iPhone : bouton Partager, puis « Sur l'écran d'accueil ».");
    return;
  }
  invite.prompt();
  invite.userChoice.then(function(){
    invite = null;
    var b = document.getElementById("btn-install");
    if(b) b.style.display = "none";
  });
}

ecranConnexion();
